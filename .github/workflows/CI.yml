name: Selenium UI automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Selenium tests (Chrome, Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run TestNG suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Generate Allure report
        if: always() && hashFiles('target/allure-results/**') != ''
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Upload test and Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request' && hashFiles('target/allure-report/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
