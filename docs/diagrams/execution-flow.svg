<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What happens on every push: CI runs the suite on parallel TestNG threads, each with its own headless Chrome, then publishes the Allure report to GitHub Pages</title>

  <!-- stage boxes -->
  <g>
    <rect x="20" y="26" rx="8" width="130" height="52" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="85" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">git push</text>
    <text x="85" y="66" text-anchor="middle" font-size="11" fill="#57606a">to main</text>
  </g>
  <g>
    <rect x="200" y="26" rx="8" width="150" height="52" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="275" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">GitHub Actions</text>
    <text x="275" y="66" text-anchor="middle" font-size="11" fill="#57606a">CI.yml workflow</text>
  </g>
  <g>
    <rect x="400" y="26" rx="8" width="120" height="52" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="460" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">TestNG</text>
    <text x="460" y="66" text-anchor="middle" font-size="11" fill="#57606a">mvn clean test</text>
  </g>

  <!-- parallel thread lanes -->
  <g>
    <rect x="580" y="6"   rx="8" width="170" height="40" fill="#ddf4e4" stroke="#2da44e" stroke-width="1.5"/>
    <text x="665" y="30" text-anchor="middle" font-size="12" fill="#1a7f37">thread 1 · Chrome 1</text>
    <rect x="580" y="56"  rx="8" width="170" height="40" fill="#ddf4e4" stroke="#2da44e" stroke-width="1.5"/>
    <text x="665" y="80" text-anchor="middle" font-size="12" fill="#1a7f37">thread 2 · Chrome 2</text>
    <rect x="580" y="106" rx="8" width="170" height="40" fill="#ddf4e4" stroke="#2da44e" stroke-width="1.5"/>
    <text x="665" y="130" text-anchor="middle" font-size="12" fill="#1a7f37">thread 3 · Chrome 3</text>
    <rect x="580" y="156" rx="8" width="170" height="40" fill="#ddf4e4" stroke="#2da44e" stroke-width="1.5"/>
    <text x="665" y="180" text-anchor="middle" font-size="12" fill="#1a7f37">thread 4 · Chrome 4</text>
    <text x="665" y="216" text-anchor="middle" font-size="11" fill="#57606a">parallelMode=classes, parallelThreads=4</text>
  </g>

  <!-- reporting column -->
  <g>
    <rect x="790" y="26"  rx="8" width="120" height="44" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="850" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Allure</text>
    <text x="850" y="61" text-anchor="middle" font-size="10" fill="#57606a">results</text>
  </g>
  <g>
    <rect x="790" y="120" rx="8" width="120" height="44" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="850" y="139" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Allure report</text>
    <text x="850" y="155" text-anchor="middle" font-size="10" fill="#57606a">single HTML file</text>
  </g>
  <g>
    <rect x="790" y="214" rx="8" width="120" height="52" fill="#f0f6ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="850" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#0550ae">GitHub Pages</text>
    <text x="850" y="253" text-anchor="middle" font-size="10" fill="#0550ae">live report link</text>
  </g>

  <!-- static arrows -->
  <path d="M150 52 L196 52" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M350 52 L396 52" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 52 C 550 52, 550 26, 576 26"  stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 52 C 550 52, 550 76, 576 76"  stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 52 C 550 52, 550 126, 576 126" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 52 C 550 52, 550 176, 576 176" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 26  C 775 26, 775 44, 786 46"  stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 76  C 775 76, 775 52, 786 50"  stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 126 C 775 126, 775 56, 786 54" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 176 C 775 176, 775 60, 786 58" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 70 L850 116"  stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 164 L850 210" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8c959f"/>
    </marker>
    <path id="run" d="M85 52 L275 52 L460 52 C 550 52, 550 26, 665 26 C 775 26, 775 48, 850 48 L850 142 L850 240" fill="none"/>
  </defs>

  <!-- traveling dot: one full run, push to Pages -->
  <circle r="6" fill="#2da44e">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="0">
      <mpath href="#run"/>
    </animateMotion>
  </circle>

  <!-- per-thread activity dots: all four move at once -->
  <circle r="4" fill="#1a7f37">
    <animate attributeName="cx" values="596;730;596" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;40;40" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#1a7f37">
    <animate attributeName="cx" values="730;596;730" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;90;90" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#1a7f37">
    <animate attributeName="cx" values="596;730;596" dur="1.7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;140;140" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#1a7f37">
    <animate attributeName="cx" values="730;596;730" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;190;190" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
